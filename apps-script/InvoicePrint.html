<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /*
     * The print view of invoice-form.html (the form the bakehouse used to print to PDF), rebuilt for Apps Script's
     * HTML→PDF converter: tables instead of flexbox/grid, and Georgia where Lora can't load. Sizes are the form's own,
     * including the padding its input boxes added around each value.
     */
    @page { size: letter; margin: 0.4in; }
    body { font-family: 'Lora', Georgia, 'Times New Roman', serif; color: #000; font-size: 16px; margin: 0; }
    table { border-collapse: collapse; width: 100%; }
    .value { font-size: 14px; }

    .header { border-bottom: 3px solid #333; margin-bottom: 30px; }
    .header td { vertical-align: top; padding: 0 0 20px; }
    .header .logo img { width: 200px; display: block; }
    .header .details { text-align: right; }
    .details h1 { margin: 0 0 15px; color: #333; font-size: 32px; letter-spacing: 2px; }
    .details table { width: auto; margin-left: auto; }
    .details td { padding: 0 0 8px; vertical-align: middle; }
    .details .label { font-weight: bold; color: #555; text-align: right; padding-right: 10px; }
    .details .value { text-align: left; padding: 9px 9px 17px; min-width: 102px; }

    .section { margin-bottom: 10px; }
    h3 {
      color: #333; font-size: 16px; text-transform: uppercase;
      border-bottom: 2px solid #333; margin: 0 0 10px; padding: 0;
    }

    .customer td { width: 50%; vertical-align: top; padding: 0 5px 0 0; }
    .customer .label { font-weight: bold; color: #555; font-size: 13px; margin-bottom: 5px; }
    .customer .value { padding: 9px; }

    .items { margin-top: 5px; }
    .items th, .items td { border: 1px solid #ddd; text-align: left; }
    .items th { background-color: #fafafa; font-weight: bold; color: #333; padding: 5px; }
    .items td { padding: 13px; }

    .totals { width: 300px; margin-left: auto; margin-top: 10px; }
    .totals td { padding: 13px 0; border-bottom: 1px solid #eee; }
    .totals td.amount { text-align: right; padding-right: 9px; font-size: 14px; }
    .totals tr.due td { border-top: 2px solid #333; border-bottom: 0; font-size: 18px; font-weight: bold; }

    .notes { margin-top: 30px; }
    .notes .value { padding: 9px; white-space: pre-wrap; }
    .footer { margin-top: 30px; text-align: center; color: #555; font-style: italic; font-size: 14px; }
    <? if (data.preview) { ?>body { padding: 0.4in; }<? } ?>
  </style>
</head>
<body>
  <table class="header">
    <tr>
      <td class="logo"><img src="<?!= data.logo ?>" alt="<?= data.businessName ?>"></td>
      <td class="details">
        <h1>Invoice</h1>
        <table>
          <tr><td class="label">Date:</td><td class="value"><?= data.date ?></td></tr>
          <tr><td class="label">Order #:</td><td class="value"><?= data.number ?></td></tr>
          <? if (data.weekLabel) { ?><tr><td class="label">Week of:</td><td class="value"><?= data.weekLabel ?></td></tr><? } ?>
        </table>
      </td>
    </tr>
  </table>

  <div class="section">
    <h3>Customer Details</h3>
    <table class="customer">
      <tr>
        <td><div class="label">Name / Company</div><div class="value"><?= data.customer ?></div></td>
        <td><div class="label">Email Address</div><div class="value"><?= data.email ?></div></td>
      </tr>
    </table>
  </div>

  <div class="section">
    <h3>Order Details</h3>
    <table class="items">
      <thead>
        <tr><th style="width:41%">Description</th><th style="width:18%">Unit Cost</th><th style="width:18%">Qty</th><th style="width:23%">Line Total</th></tr>
      </thead>
      <tbody>
        <? data.lines.forEach(function (line) { ?>
        <tr class="value"><td><?= line.product ?></td><td><?= line.unitPrice ?></td><td><?= line.qty ?></td><td><?= line.lineTotal ?></td></tr>
        <? }); ?>
      </tbody>
    </table>
  </div>

  <table class="totals">
    <tr><td>Subtotal:</td><td class="amount"><?= data.subtotal ?></td></tr>
    <tr><td>Delivery / Fees:</td><td class="amount"><?= data.fees ?></td></tr>
    <tr class="due"><td>Total Due:</td><td class="amount"><?= data.total ?></td></tr>
  </table>

  <? if (data.notes) { ?>
  <div class="section notes">
    <h3>Additional Instructions</h3>
    <div class="value"><?= data.notes ?></div>
  </div>
  <? } ?>

  <? if (data.footer) { ?><div class="footer"><?= data.footer ?></div><? } ?>
</body>
</html>
