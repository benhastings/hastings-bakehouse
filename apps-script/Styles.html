<style>
  :root {
    --green: #1f4d38;
    --green-dark: #163a2a;
    --green-tint: #e8f0eb;
    --cream: #f7f2e6;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --line: #dedbd3;
    --bg: #eceae4;
    --paper: #ffffff;
    --warn-bg: #fff4d6;
    --warn-ink: #6b4e00;
    --error-bg: #fde8e6;
    --error-ink: #8a1c12;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    background: var(--green); color: var(--cream);
  }
  .topbar img { width: 40px; height: 40px; background: var(--cream); border-radius: 50%; padding: 2px; }
  .topbar .brand { font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab {
    border: 0; background: transparent; color: var(--cream);
    padding: 8px 12px; border-radius: 999px; cursor: pointer; min-height: 40px;
  }
  .tab[aria-selected="true"] { background: var(--cream); color: var(--green); font-weight: 700; }

  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 120px; }
  [hidden] { display: none !important; }

  h2 { margin: 0; font-size: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .card {
    background: var(--paper); border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 16px; margin-bottom: 12px;
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--green); background: var(--paper); color: var(--green);
    cursor: pointer; font-weight: 600; text-decoration: none;
  }
  .btn.primary { background: var(--green); color: var(--cream); }
  .btn.primary:hover { background: var(--green-dark); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: progress; }
  .icon-btn {
    min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--paper);
    border-radius: var(--radius); cursor: pointer; font-size: 18px;
  }

  /* ---------- Inputs ---------- */
  input[type=text], input[type=email], input[type=number], input[type=date], textarea, select {
    width: 100%; min-height: 44px; padding: 8px 10px;
    border: 1px solid #c9c6bd; border-radius: 6px; background: #fff; font-size: 16px;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #555; }
  input[type=number] { text-align: right; }

  /* ---------- Production ---------- */
  .weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .weeknav h2 { flex: 1; text-align: center; }

  .days { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .days { grid-template-columns: 1fr 1fr 1fr; } }

  .day { padding: 0; overflow: hidden; margin: 0; }
  .day-head {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 12px 16px; border: 0; background: var(--paper); cursor: pointer; text-align: left;
    min-height: 52px;
  }
  .day-head .name { font-weight: 700; }
  .day.today .day-head { background: var(--green-tint); }
  .day.dirty .day-head .name::after { content: ' •'; color: #c77700; }
  .day-body { padding: 0 16px 12px; }
  .day table { width: 100%; border-collapse: collapse; }
  .day th { font-size: 12px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px; }
  .day th:first-child { text-align: left; }
  .day td { padding: 4px; }
  .day td:first-child { font-size: 14px; }
  .day td input { width: 76px; min-height: 40px; }
  .day .other { margin-top: 8px; font-size: 13px; color: var(--muted); }

  .totals table { width: 100%; border-collapse: collapse; }
  .totals td { padding: 6px 0; border-bottom: 1px solid #eee; }
  .totals td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .totals .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }

  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--warn-bg); color: var(--warn-ink); box-shadow: 0 -2px 8px rgba(0,0,0,.1);
  }

  /* ---------- Invoice ---------- */
  .paper { background: var(--paper); border-radius: 4px; box-shadow: 0 8px 16px rgba(0,0,0,.1); padding: 24px; }
  @media (min-width: 700px) { .paper { padding: 40px; } }

  .inv-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    border-bottom: 3px solid #333; padding-bottom: 16px; margin-bottom: 20px;
  }
  .inv-header img { width: 140px; height: auto; }
  .inv-meta { display: grid; gap: 8px; min-width: 180px; text-align: right; }
  .inv-meta h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  .inv-meta .num { font-weight: 700; }
  @media (max-width: 599px) {
    .inv-header { flex-direction: column; align-items: stretch; }
    .inv-header img { width: 110px; }
    .inv-meta { text-align: left; }
  }

  .section-title {
    background: #f4f4f4; padding: 6px 8px; border-left: 3px solid #333;
    font-size: 14px; text-transform: uppercase; letter-spacing: .5px; margin: 20px 0 10px;
  }
  .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 600px) { .grid2 { grid-template-columns: 1fr 1fr; } }

  .weekrow { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .weekrow label { flex: 1; min-width: 160px; }

  .items-head, .item {
    display: grid; gap: 8px; align-items: center;
    grid-template-columns: 1fr 100px 80px 100px 44px;
  }
  .items-head { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); padding: 0 0 4px; }
  .items-head span:not(:first-child) { text-align: right; }
  .item { padding: 6px 0; border-bottom: 1px solid #eee; }
  .item .line-total { text-align: right; font-variant-numeric: tabular-nums; }
  .item .mini { display: flex; flex-direction: column; gap: 2px; }
  .item .mini span:first-child { display: none; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .item .mini.total { align-items: flex-end; }
  .item .price-note { grid-column: 1 / -1; font-size: 13px; color: var(--warn-ink); }
  .item .price-note label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .item .price-note input { width: 18px; height: 18px; min-height: 0; }
  @media (max-width: 599px) {
    .items-head { display: none; }
    .item { grid-template-columns: 1fr 1fr 1fr 44px; }
    .item .product { grid-column: 1 / -1; }
    .item .mini span:first-child { display: block; }
    .item .mini.total .line-total { min-height: 44px; display: flex; align-items: center; }
    .item .icon-btn { align-self: end; }
  }

  .totals-box { margin-left: auto; width: 100%; max-width: 320px; margin-top: 12px; }
  .totals-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; gap: 12px; }
  .totals-row input { width: 120px; }
  .totals-row.grand { border-bottom: 0; border-top: 2px solid #333; font-size: 18px; font-weight: 700; }

  .inv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  @media (max-width: 599px) { .inv-actions .btn { flex: 1 1 100%; } }

  /* ---------- Banners ---------- */
  .banner { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; line-height: 1.4; }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.error { background: var(--error-bg); color: var(--error-ink); }
  .banner.ok { background: var(--green-tint); color: var(--green-dark); }
  .banner a { color: inherit; font-weight: 700; }
  .banner .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* ---------- History ---------- */
  .hist-row {
    display: grid; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee;
    grid-template-columns: 1fr auto;
  }
  .hist-row .who { font-weight: 700; }
  .hist-row .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .hist-row .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hist-row .acts .btn { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .hist-row .acts select { width: auto; min-height: 36px; font-size: 14px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #eee; }
  .pill.drafted { background: #e3ecf9; color: #1d4b8f; }
  .pill.sent { background: var(--warn-bg); color: var(--warn-ink); }
  .pill.paid { background: var(--green-tint); color: var(--green-dark); }

  /* ---------- Modal, toast, loading ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: flex; flex-direction: column; padding: 16px; }
  .modal .bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .modal iframe { flex: 1; width: 100%; max-width: 850px; margin: 0 auto; border: 0; background: #fff; border-radius: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: #222; color: #fff; padding: 12px 16px; border-radius: var(--radius); max-width: calc(100% - 32px);
  }
  .toast.error { background: var(--error-ink); }

  .loading { text-align: center; padding: 48px 16px; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--green); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 599px) {
    .topbar { flex-wrap: wrap; padding: 8px 12px; }
    .topbar .brand { font-size: 15px; }
    .tabs { width: 100%; margin-left: 0; justify-content: space-between; }
    .tab { flex: 1; padding: 8px 4px; }
  }
</style>
